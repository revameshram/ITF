<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AegisVision — AI Assurance Workbench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13.2 12 15 6.9-1.8 12-7.5 12-15V7z' fill='%230f1720' stroke='%235fb8c2' stroke-width='2'/%3E%3Ccircle cx='16' cy='15' r='4' fill='%235fb8c2'/%3E%3C/svg%3E">
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2 4 7v8c0 7.5 5.1 13.2 12 15 6.9-1.8 12-7.5 12-15V7z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="15" r="3.6" fill="currentColor"/><path d="M9 15h3.5M19.5 15H23M16 8v3.5M16 18.5V22" stroke="currentColor" stroke-width="1.4"/></svg>
        <div>
          <div class="brand-name">AegisVision</div>
          <div class="brand-sub">AI assurance workbench</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="airgap" id="airgap" title="In-process network guard + CSP default-src 'self'">
          <span class="airgap-dot"></span><span>OFFLINE · AIR-GAPPED</span>
        </div>
        <div class="muted tiny" id="signer"></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-right">
          <span class="demo-tag" title="Dataset, models and attack scenarios are synthetic">DEMO MODE</span>
          <div class="overall" id="overall">—</div>
          <button class="btn theme-btn" id="theme-btn" type="button" aria-label="Switch to light mode" title="Switch to light mode">
            <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
          </button>
          <button class="btn btn-primary" id="run-btn">Run assurance check</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="drawer" class="drawer" aria-hidden="true"><div class="drawer-inner" id="drawer-inner"></div></div>
  <div id="toast" class="toast"></div>
  <script src="/static/vendor/cytoscape.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
